                9: { title: "Merry Merry Berry", artist: "makoto_sako_1961" },
                10: { title: "At dusk, we always climbed the hill", artist: "makoto_sako_1961" },
                11: { title: "Raise your- coffee cup and sya YO", artist: "rojiura_m_sakou" },

                13: { title: "So keep hold on tight", artist: "highspeedjrook8819" },
                14: { title: "渋谷宇田川の夕べ", artist: "rojiura_m_sakou" },
                15: { title: "路地裏の情熱オープニングテーマ", artist: "highspeedjrook8819" },
                16: { title: "はじまりはただのひとこと", artist: "highspeedjrook8819" },
                17: { title: "詩吟インザモーニング", artist: "rojiura_m_sakou" },
                18: { title: "燃えないゴミの日", artist: "rojiura_m_sakou" },
                19: { title: "Happy birthday MIKU", artist: "rojiura_m_sakou" },
                20: { title: "Time have change but dreams remain", artist: "rojiura_m_sakou" }
            };

            /* ============================================================
             * 高精度 ID3v2 & ID3v1 バイナリタグパーサー
             * 不完全なヘッダーや各種文字エンコーディング（UTF-8, UTF-16, Shift_JIS）に完全対応
             * ============================================================ */
            async function parseMP3MetadataDirectly(fileOrBlob) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    // 先頭1MBを読み込んでID3v2ヘッダーとフレームを探索
                    const sliceHead = fileOrBlob.slice(0, 1024 * 1024);

                    reader.onload = async function(e) {
                        try {
                            const buffer = e.target.result;
                            const view = new DataView(buffer);
                            const result = {};

                            // ID3v2 判定
                            if (view.byteLength >= 10 &&
                                view.getUint8(0) === 0x49 && 
                                view.getUint8(1) === 0x44 && 
                                view.getUint8(2) === 0x33) {
                                
                                const version = view.getUint8(3); // 2, 3, 4
                                const tagSize = ((view.getUint8(6) & 0x7f) << 21) |
                                                ((view.getUint8(7) & 0x7f) << 14) |
                                                ((view.getUint8(8) & 0x7f) << 7) |
                                                (view.getUint8(9) & 0x7f);

                                let offset = 10;
                                const limit = Math.min(tagSize + 10, buffer.byteLength);

                                while (offset < limit - 8) {
                                    let frameId = '';
                                    let frameSize = 0;
                                    let headerLen = 10;

                                    if (version === 2) {
                                        frameId = String.fromCharCode(
                                            view.getUint8(offset),
                                            view.getUint8(offset + 1),
                                            view.getUint8(offset + 2)
                                        );
                                        frameSize = (view.getUint8(offset + 3) << 16) |
                                                    (view.getUint8(offset + 4) << 8) |
                                                    view.getUint8(offset + 5);
                                        headerLen = 6;
                                    } else {
                                        frameId = String.fromCharCode(
                                            view.getUint8(offset),
                                            view.getUint8(offset + 1),
                                            view.getUint8(offset + 2),
                                            view.getUint8(offset + 3)
                                        );
                                        if (version === 4) {
                                            frameSize = ((view.getUint8(offset + 4) & 0x7f) << 21) |
                                                        ((view.getUint8(offset + 5) & 0x7f) << 14) |
                                                        ((view.getUint8(offset + 6) & 0x7f) << 7) |
                                                        (view.getUint8(offset + 7) & 0x7f);
                                        } else {
                                            frameSize = view.getUint32(offset + 4);
                                        }
                                        headerLen = 10;
                                    }

                                    // パディング領域到達
                                    if (!frameId || frameId.charCodeAt(0) === 0) break;
                                    if (frameSize <= 0 || offset + headerLen + frameSize > buffer.byteLength) break;

                                    const frameDataOffset = offset + headerLen;
                                    const encoding = view.getUint8(frameDataOffset);
                                    const rawBytes = new Uint8Array(buffer, frameDataOffset + 1, Math.max(0, frameSize - 1));

                                    function decodeText(bytes, enc) {
                                        try {
                                            if (enc === 0) {
                                                // ISO-8859-1 または 日本語環境のShift_JISフォールバック
                                                const sjisStr = new TextDecoder('shift-jis', { fatal: false }).decode(bytes).replace(/\0/g, '').trim();
                                                return sjisStr || new TextDecoder('iso-8859-1').decode(bytes).replace(/\0/g, '').trim();
                                            }
                                            if (enc === 1) return new TextDecoder('utf-16').decode(bytes).replace(/\0/g, '').trim();
                                            if (enc === 2) return new TextDecoder('utf-16be').decode(bytes).replace(/\0/g, '').trim();
                                            return new TextDecoder('utf-8').decode(bytes).replace(/\0/g, '').trim();
                                        } catch (err) {
                                            return '';
                                        }
                                    }

                                    // タイトル (TIT2 / TT2)
                                    if (frameId === 'TIT2' || frameId === 'TT2') {
                                        const text = decodeText(rawBytes, encoding);
                                        if (text) result.title = text;
                                    }
                                    // アーティスト (TPE1 / TP1)
                                    else if (frameId === 'TPE1' || frameId === 'TP1') {
                                        const text = decodeText(rawBytes, encoding);
                                        if (text) result.artist = text;
                                    }
                                    // アルバム (TALB / TAL)
                                    else if (frameId === 'TALB' || frameId === 'TAL') {
                                        const text = decodeText(rawBytes, encoding);
                                        if (text) result.album = text;
                                    }
                                    // カバーアート (APIC / PIC)
                                    else if (frameId === 'APIC' && !result.picture) {
                                        try {
                                            let pOffset = frameDataOffset + 1;
                                            let mime = "";
                                            while (view.getUint8(pOffset) !== 0 && pOffset < frameDataOffset + frameSize) {
                                                mime += String.fromCharCode(view.getUint8(pOffset));
                                                pOffset++;
                                            }
                                            pOffset++; // null-term
                                            pOffset++; // picture type
                                            if (encoding === 1 || encoding === 2) {
                                                while (pOffset + 1 < frameDataOffset + frameSize && !(view.getUint8(pOffset) === 0 && view.getUint8(pOffset + 1) === 0)) {
                                                    pOffset += 2;
                                                }
                                                pOffset += 2;
                                            } else {
                                                while (pOffset < frameDataOffset + frameSize && view.getUint8(pOffset) !== 0) {
                                                    pOffset++;
                                                }
                                                pOffset++;
                                            }
                                            const imgLen = (frameDataOffset + frameSize) - pOffset;
                                            if (imgLen > 0) {
                                                const imgBytes = new Uint8Array(buffer, pOffset, imgLen);
                                                const blob = new Blob([imgBytes], { type: mime || 'image/jpeg' });
                                                result.picture = URL.createObjectURL(blob);
                                            }
                                        } catch (e) {}
                                    }

                                    offset += headerLen + frameSize;
                                }

                                if (result.title || result.artist) {
                                    resolve(result);
                                    return;
                                }
                            }

                            // ID3v1 の読み取り（ファイル末尾128バイト）
                            if (fileOrBlob.size > 128) {
                                const tailSlice = fileOrBlob.slice(fileOrBlob.size - 128);
                                const tailReader = new FileReader();
                                tailReader.onload = function(te) {
                                    const tailBuf = te.target.result;
                                    const tailView = new DataView(tailBuf);
                                    if (tailView.getUint8(0) === 0x54 && tailView.getUint8(1) === 0x41 && tailView.getUint8(2) === 0x47) {
                                        const decoder = new TextDecoder('shift-jis');
                                        const v1Title = decoder.decode(new Uint8Array(tailBuf, 3, 30)).replace(/\0/g, '').trim();
                                        const v1Artist = decoder.decode(new Uint8Array(tailBuf, 33, 30)).replace(/\0/g, '').trim();
                                        const v1Album = decoder.decode(new Uint8Array(tailBuf, 63, 30)).replace(/\0/g, '').trim();

                                        if (v1Title) result.title = v1Title;
                                        if (v1Artist) result.artist = v1Artist;
                                        if (v1Album) result.album = v1Album;
                                    }
                                    resolve(Object.keys(result).length > 0 ? result : null);
                                };
                                tailReader.onerror = () => resolve(Object.keys(result).length > 0 ? result : null);
                                tailReader.readAsArrayBuffer(tailSlice);
                            } else {
                                resolve(Object.keys(result).length > 0 ? result : null);
                            }
                        } catch (err) {
                            resolve(null);
                        }
                    };

                    reader.onerror = () => resolve(null);
                    reader.readAsArrayBuffer(sliceHead);
                });
            }

            // トースト通知
            function notify(msg) {
                statusToast.textContent = msg;
                statusToast.classList.add('bg-indigo-600', 'text-white');
                setTimeout(() => {
                    statusToast.classList.remove('bg-indigo-600', 'text-white');
                }, 4000);
            }

            // 秒数フォーマット (m:ss)
            function formatTime(seconds) {
                if (isNaN(seconds) || seconds === Infinity) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // 初期トラック生成 (001.mp3 〜 020.mp3)
            function initTracks() {
                tracks = [];
                for (let i = 1; i <= 20; i++) {
                    const numStr = String(i).padStart(3, '0');
                    const fileName = `${numStr}.mp3`;
                    const meta = verifiedInitialMetadata[i];

                    tracks.push({
                        id: i,
                        fileName: fileName,
                        src: `./${fileName}`,
                        title: meta ? meta.title : fileName,
                        artist: meta ? meta.artist : 'rojiura_m_sakou',
                        album: 'あなたの曲をつくりませんか？',
                        picture: null,
                        hasMeta: true,
                        fileObj: null
                    });
                }

                renderPlaylist();
                loadTrack(0);

                // 同階層に配置されている場合の自動スキャン
                attemptBackgroundFetchAll();
            }

            // バックグラウンドで相対パスからの取得を試行
            async function attemptBackgroundFetchAll() {
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    try {
                        const res = await fetch(track.src);
                        if (!res.ok) continue;
                        const blob = await res.blob();
                        const meta = await parseMP3MetadataDirectly(blob);
                        if (meta) {
                            applyMetadata(track, meta, i);
                        }
                    } catch (e) {
                        // 相対パス未配置時はプリセットのまま安全に再生待機
                    }
                }
            }

            // メタデータの適用
            function applyMetadata(track, meta, index) {
                if (meta.title) track.title = meta.title;
                if (meta.artist) track.artist = meta.artist;
                if (meta.album) track.album = meta.album;
                if (meta.picture) track.picture = meta.picture;

                updatePlaylistRow(index);
                if (index === currentIndex) {
                    updatePlayerDisplay(track);
                }
            }

            // プレイヤーメイン画面の表示更新
            function updatePlayerDisplay(track) {
                currentTitle.textContent = track.title;
                currentArtist.textContent = track.artist;
                currentAlbum.textContent = `${track.album} (${track.fileName})`;

                if (track.picture) {
                    albumArt.src = track.picture;
                    albumArt.classList.remove('hidden');
                    albumArtPlaceholder.classList.add('hidden');
                } else {
                    albumArt.src = '';
                    albumArt.classList.add('hidden');
                    albumArtPlaceholder.classList.remove('hidden');
                }
            }

            // 1行のリスト表示更新
            function updatePlaylistRow(idx) {
                const item = playlistContainer.children[idx];
                if (!item) return;
                const track = tracks[idx];

                const titleEl = item.querySelector('.track-title');
                const infoEl = item.querySelector('.track-info');
                const badge = item.querySelector('.track-badge');
                const rightIndicator = item.querySelector('.track-right-icon');

                if (titleEl) titleEl.textContent = track.title;
                if (infoEl) infoEl.textContent = `${track.artist} • ${track.fileName}`;

                if (idx === currentIndex) {
                    item.className = 'playlist-item flex items-center justify-between p-3.5 sm:p-4 rounded-2xl cursor-pointer transition-all duration-300 border text-white playing-active-item';
                    
                    if (isPlaying) {
                        badge.innerHTML = `
                            <div class="flex items-end justify-center gap-1 h-5 w-5">
                                <span class="eq-bar"></span>
                                <span class="eq-bar"></span>
                                <span class="eq-bar"></span>
                            </div>
                        `;
                    } else {
                        badge.innerHTML = `<i class="fa-solid fa-pause text-indigo-300 text-sm"></i>`;
                    }
                    badge.className = 'track-badge w-10 h-10 rounded-xl bg-indigo-600/50 flex items-center justify-center shrink-0 border border-indigo-400/40 text-sm font-bold';

                    if (titleEl) titleEl.className = 'track-title text-base sm:text-lg font-bold text-white truncate drop-shadow-sm';
                    if (rightIndicator) {
                        rightIndicator.innerHTML = '<span class="text-xs uppercase tracking-wider bg-indigo-500/30 text-indigo-200 border border-indigo-400/40 px-2.5 py-1 rounded-full font-bold">再生中</span>';
                    }
                } else {
                    item.className = 'playlist-item flex items-center justify-between p-3.5 sm:p-4 rounded-2xl cursor-pointer transition-all duration-200 border bg-slate-800/40 border-slate-700/40 text-slate-300 hover:bg-slate-800/80 active:bg-slate-800';
                    badge.innerHTML = String(idx + 1).padStart(2, '0');
                    badge.className = 'track-badge w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-sm font-semibold text-slate-400 shrink-0';
                    if (titleEl) titleEl.className = 'track-title text-base sm:text-lg font-semibold text-slate-200 truncate';
                    if (rightIndicator) {
                        rightIndicator.innerHTML = '<i class="fa-solid fa-play text-sm text-slate-500"></i>';
                    }
                }
            }

            // プレイリストの全体描画
            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                playlistCount.textContent = `${tracks.length} 曲`;

                tracks.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item flex items-center justify-between p-3.5 sm:p-4 rounded-2xl cursor-pointer transition-all duration-200 border ${
                        index === currentIndex
                            ? 'text-white playing-active-item'
                            : 'bg-slate-800/40 border-slate-700/40 text-slate-300 hover:bg-slate-800/80 active:bg-slate-800'
                    }`;

                    item.addEventListener('click', (e) => {
                        if (e.target.closest('.edit-btn')) return;
                        loadTrack(index);
                        playAudio();
                    });

                    item.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden pr-2 flex-1">
                            <div class="track-badge w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-sm font-semibold text-slate-400 shrink-0">
                                ${String(index + 1).padStart(2, '0')}
                            </div>
                            <div class="overflow-hidden flex-1">
                                <p class="track-title text-base sm:text-lg font-semibold truncate ${index === currentIndex ? 'text-white font-bold' : 'text-slate-200'}">
                                    ${track.title}
                                </p>
                                <p class="track-info text-xs sm:text-sm text-slate-400 truncate mt-1">
                                    ${track.artist} • ${track.fileName}
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button class="edit-btn p-2.5 text-slate-400 hover:text-indigo-300 rounded-xl transition active:scale-95" title="曲名を直接編集">
                                <i class="fa-solid fa-pen text-sm"></i>
                            </button>
                            <div class="track-right-icon text-sm text-slate-500 w-5 text-center">
                                <i class="fa-solid fa-play"></i>
                            </div>
                        </div>
                    `;

                    // タイトルのクイック編集機能
                    const editBtn = item.querySelector('.edit-btn');
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const current = track.title;
                        const modal = document.createElement('div');
                        modal.className = 'fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4';
                        modal.innerHTML = `
                            <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
                                <h4 class="text-sm font-bold text-white flex items-center gap-2">
                                    <i class="fa-solid fa-pen text-indigo-400"></i> ${track.fileName} の曲名編集
                                </h4>
                                <div>
                                    <label class="text-xs text-slate-400 block mb-1">曲タイトル</label>
                                    <input type="text" id="editTitleInput" value="${current.replace(/"/g, '&quot;')}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                </div>
                                <div class="flex justify-end gap-2">
                                    <button id="cancelEditBtn" class="px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-800 rounded-lg">キャンセル</button>
                                    <button id="saveEditBtn" class="px-4 py-1.5 text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow">保存</button>
                                </div>
                            </div>
                        `;
                        document.body.appendChild(modal);

                        const input = modal.querySelector('#editTitleInput');
                        input.focus();
                        input.select();

                        modal.querySelector('#cancelEditBtn').addEventListener('click', () => modal.remove());
                        modal.querySelector('#saveEditBtn').addEventListener('click', () => {
                            const val = input.value.trim();
                            if (val) {
                                track.title = val;
                                updatePlaylistRow(index);
                                if (index === currentIndex) updatePlayerDisplay(track);
                            }
                            modal.remove();
                        });
                    });

                    playlistContainer.appendChild(item);
                });
            }

            function scrollToCurrentTrack() {
                const activeItem = playlistContainer.children[currentIndex];
                if (activeItem) {
                    activeItem.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }
            }

            // トラック読み込み
            function loadTrack(index) {
                if (index < 0 || index >= tracks.length) return;
                currentIndex = index;
                const track = tracks[currentIndex];

                audio.src = track.src;
                audio.load();

                updatePlayerDisplay(track);

                for (let i = 0; i < tracks.length; i++) {
                    updatePlaylistRow(i);
                }

                scrollToCurrentTrack();
            }

            // 再生 / 一時停止
            function playAudio() {
                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.className = "fa-solid fa-pause text-xl";
                    updatePlaylistRow(currentIndex);
                }).catch(err => {
                    console.log("Playback notice:", err);
                    notify("再生音源が見つかりません。上の「フォルダを一括選択」からファイルを選択してください。");
                });
            }

            function pauseAudio() {
                audio.pause();
                isPlaying = false;
                playIcon.className = "fa-solid fa-play text-xl ml-0.5";
                updatePlaylistRow(currentIndex);
            }

            function togglePlay() {
                if (isPlaying) {
                    pauseAudio();
                } else {
                    playAudio();
                }
            }

            // ◀ 前へ
            function playPrev() {
                let prevIndex = currentIndex - 1;
                if (prevIndex < 0) {
                    prevIndex = tracks.length - 1;
                }
                loadTrack(prevIndex);
                playAudio();
            }

            // ▶ 次へ
            function playNext() {
                let nextIndex;
                if (isShuffle) {
                    nextIndex = Math.floor(Math.random() * tracks.length);
                    if (tracks.length > 1 && nextIndex === currentIndex) {
                        nextIndex = (currentIndex + 1) % tracks.length;
                    }
                } else {
                    nextIndex = currentIndex + 1;
                    if (nextIndex >= tracks.length) {
                        nextIndex = 0;
                    }
                }
                loadTrack(nextIndex);
                playAudio();
            }

            // コントロールボタン
            playPauseBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', playPrev);
            nextBtn.addEventListener('click', playNext);

            audio.addEventListener('timeupdate', () => {
                if (!isNaN(audio.duration)) {
                    const progress = (audio.currentTime / audio.duration) * 100;
                    seekBar.value = progress;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    durationEl.textContent = formatTime(audio.duration);
                }
            });

            seekBar.addEventListener('input', () => {
                if (!isNaN(audio.duration)) {
                    audio.currentTime = (seekBar.value / 100) * audio.duration;
                }
            });

            // 曲終了時の連続自動再生
            audio.addEventListener('ended', () => {
                if (isRepeat) {
                    audio.currentTime = 0;
                    playAudio();
                } else {
                    playNext();
                }
            });

            // 音量調節
            volumeBar.addEventListener('input', (e) => {
                audio.volume = e.target.value;
                if (audio.volume === 0) {
                    volumeIcon.className = "fa-solid fa-volume-xmark text-sm";
                } else if (audio.volume < 0.5) {
                    volumeIcon.className = "fa-solid fa-volume-low text-sm";
                } else {
                    volumeIcon.className = "fa-solid fa-volume-high text-sm";
                }
            });

            muteBtn.addEventListener('click', () => {
                if (audio.volume > 0) {
                    audio.dataset.prevVolume = audio.volume;
                    audio.volume = 0;
                    volumeBar.value = 0;
                    volumeIcon.className = "fa-solid fa-volume-xmark text-sm";
                } else {
                    const prev = audio.dataset.prevVolume || 0.8;
                    audio.volume = prev;
                    volumeBar.value = prev;
                    volumeIcon.className = "fa-solid fa-volume-high text-sm";
                }
            });

            // シャッフル & リピート
            shuffleBtn.addEventListener('click', () => {
                isShuffle = !isShuffle;
                shuffleBtn.classList.toggle('text-indigo-400', isShuffle);
                shuffleBtn.classList.toggle('bg-slate-800', isShuffle);
                notify(isShuffle ? "シャッフル再生: ON" : "シャッフル再生: OFF");
            });

            repeatBtn.addEventListener('click', () => {
                isRepeat = !isRepeat;
                repeatBtn.classList.toggle('text-indigo-400', isRepeat);
                repeatBtn.classList.toggle('bg-slate-800', isRepeat);
                notify(isRepeat ? "1曲リピート: ON" : "連続自動再生モード");
            });

            /* ============================================================
             * ファイル / フォルダ選択時の処理
             * ============================================================ */
            async function handleUploadedFiles(fileList) {
                const files = Array.from(fileList).filter(file => file.type.startsWith('audio/') || file.name.toLowerCase().endsWith('.mp3'));
                if (files.length === 0) {
                    notify("MP3ファイルが見つかりませんでした。");
                    return;
                }

                // 001.mp3, 002.mp3 等の順にソート
                files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

                tracks = [];
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const objectUrl = URL.createObjectURL(file);
                    
                    const match = file.name.match(/(\d+)/);
                    const fileNum = match ? parseInt(match[1], 10) : (i + 1);
                    const preset = verifiedInitialMetadata[fileNum];

                    tracks.push({
                        id: fileNum,
                        fileName: file.name,
                        src: objectUrl,
                        title: preset ? preset.title : file.name,
                        artist: preset ? preset.artist : 'rojiura_m_sakou',
                        album: 'あなたの曲をつくりませんか？',
                        picture: null,
                        hasMeta: true,
                        fileObj: file
                    });
                }

                renderPlaylist();
                loadTrack(0);
                notify(`${tracks.length} 曲を読み込みました`);

                // バイナリからカバーアートやID3メタデータを補完解析
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    parseMP3MetadataDirectly(track.fileObj).then((meta) => {
                        if (meta) {
                            if (meta.title) track.title = meta.title;
                            if (meta.artist) track.artist = meta.artist;
                            if (meta.album) track.album = meta.album;
                            if (meta.picture) track.picture = meta.picture;
                            updatePlaylistRow(i);
                            if (i === currentIndex) {
                                updatePlayerDisplay(track);
                            }
                        }
                    });
                }
            }

            folderInput.addEventListener('change', (e) => handleUploadedFiles(e.target.files));
            fileInput.addEventListener('change', (e) => handleUploadedFiles(e.target.files));

            // ドラッグ＆ドロップ対応
            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleUploadedFiles(e.dataTransfer.files);
                }
            });

            // キーボード操作（スペース: 再生/停止, 左右キー: ◀ ▶ スキップ）
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowLeft') {
                    playPrev();
                } else if (e.code === 'ArrowRight') {
                    playNext();
                }
            });

            // 初期化実行
            initTracks();
        });
    </script>
</body>
</html>
